name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - name: Provision Nexus container
        run: make e2e-up
      - name: Run e2e suite
        run: make e2e-test
      - name: Dump container logs on failure
        if: failure()
        run: docker logs --tail 200 nx-e2e
