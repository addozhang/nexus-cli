name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          check-latest: true
      - name: Unit tests
        run: go test ./internal/... -race -cover
      - name: Integration tests
        run: go test ./test/integration/... -race
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
