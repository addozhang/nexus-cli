version: 2

project_name: nx

builds:
  - id: nx
    main: ./cmd/nx
    binary: nx
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: nx
    ids:
      - nx
    binaries:
      - nx
    repository:
      owner: addozhang
      name: homebrew-tap
      # Uses HOMEBREW_TAP_GITHUB_TOKEN secret in the release workflow.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/addozhang/nexus-cli"
    description: "Read-only query CLI for Sonatype Nexus Repository 3"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: false
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
